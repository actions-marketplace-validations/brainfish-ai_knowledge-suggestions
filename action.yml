name: "Brainfish Knowledge Suggestions"
description: "Generate AI-powered article suggestions from git diffs using the Brainfish API"
branding:
  icon: "file-plus"
  color: "blue"

inputs:
  collection_id:
    description: "The collection ID to target for suggestions"
    required: false
  base:
    description: "The base commit SHA to generate the diff from"
    required: false
  pr_number:
    description: "A pull request number to generate suggestions from. When set, the PR title, description, labels, commits and diff are fetched from the GitHub API, so no checkout is required and the action can run on any event (e.g. workflow_dispatch, merged PRs)."
    required: false
  repository:
    description: "The repository (owner/name) that contains the pull request. Only used with pr_number."
    required: false
    default: ${{ github.repository }}
  github_token:
    description: "GitHub token used to read the pull request. Only used with pr_number. Needs pull-requests: read."
    required: false
    default: ${{ github.token }}
  max_diff_lines:
    description: "Diffs up to this many lines (after excluding lock, generated and binary files) are sent in full. Larger diffs are replaced by a summary of changed files, line counts and touched functions."
    required: false
    default: "1000"
  api_key:
    description: "The Brainfish API token (bf_api_...) for authentication"
    required: true
  api_url:
    description: "The Brainfish API base URL"
    required: false
    default: "https://api.brainfi.sh"

outputs:
  task_id:
    description: "The task ID for the triggered suggestion pipeline"
    value: ${{ steps.suggest.outputs.task_id }}
  status:
    description: "The status of the suggestion request"
    value: ${{ steps.suggest.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Generate diff
      id: diff
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.github_token }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_PUSH_BEFORE_SHA: ${{ github.event.before }}
        EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
        EVENT_PR_BODY: ${{ github.event.pull_request.body }}
        MAX_DIFF_LINES: ${{ inputs.max_diff_lines }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        CONTEXT_FILE=$(mktemp)
        RAW_DIFF=$(mktemp)
        DIFF_SECTION=$(mktemp)
        trap 'rm -f "$CONTEXT_FILE" "$RAW_DIFF" "$DIFF_SECTION"' EXIT

        if [ -n "$INPUT_PR_NUMBER" ]; then
          # Pull request mode: fetch everything from the GitHub API
          if ! [[ "$INPUT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a number, got '$INPUT_PR_NUMBER'."
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::The GitHub CLI (gh) is required when using pr_number."
            exit 1
          fi

          echo "Fetching pull request #$INPUT_PR_NUMBER from $INPUT_REPOSITORY"

          PR_JSON=$(gh pr view "$INPUT_PR_NUMBER" --repo "$INPUT_REPOSITORY" \
            --json number,title,body,url,labels,commits)

          if ! gh pr diff "$INPUT_PR_NUMBER" --repo "$INPUT_REPOSITORY" --color never > "$RAW_DIFF"; then
            echo "::error::Failed to fetch the diff for PR #$INPUT_PR_NUMBER. GitHub's API refuses diffs over 300 files / 20,000 lines; use a checkout with 'base' instead."
            exit 1
          fi

          {
            echo "## $(echo "$PR_JSON" | jq -r '.title')"
            echo ""
            echo "$PR_JSON" | jq -r '"Pull request: \(.url)"'
            LABELS=$(echo "$PR_JSON" | jq -r '[.labels[].name] | join(", ")')
            if [ -n "$LABELS" ]; then
              echo "Labels: $LABELS"
            fi
            echo ""
            PR_BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
            if [ -n "$PR_BODY" ]; then
              echo "$PR_BODY"
              echo ""
            fi
            echo "## Commits"
            echo ""
            echo "$PR_JSON" | jq -r '.commits[] | "### \(.messageHeadline)\n\n\(.messageBody)\n"'
          } > "$CONTEXT_FILE"

          SOURCE="PR #$INPUT_PR_NUMBER"
        else
          BASE="$INPUT_BASE"

          # Resolve the base commit
          if [ -n "$BASE" ]; then
            echo "Using provided base: $BASE"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$EVENT_PR_BASE_SHA"
            echo "Using pull request base: $BASE"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$EVENT_PUSH_BEFORE_SHA"
            echo "Using push before SHA: $BASE"
          else
            BASE="HEAD~1"
            echo "Falling back to previous commit: $BASE"
          fi

          # Validate base is a valid ref
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::error::Base ref '$BASE' does not exist. Ensure the repository is fetched with sufficient depth."
            exit 1
          fi

          # Get full commit messages (subject + body) between base and HEAD
          COMMITS=$(git log --format="### %s%n%n%b" "$BASE"..HEAD 2>/dev/null || \
                    git log --format="### %s%n%n%b" -1 HEAD)

          git diff --unified=3 --no-color --no-ext-diff \
            --src-prefix=a/ --dst-prefix=b/ "$BASE" > "$RAW_DIFF"

          {
            # Include PR title and body if this is a pull request
            if [ "$EVENT_NAME" = "pull_request" ]; then
              if [ -n "$EVENT_PR_TITLE" ]; then
                echo "## $EVENT_PR_TITLE"
                echo ""
              fi
              if [ -n "$EVENT_PR_BODY" ]; then
                echo "$EVENT_PR_BODY"
                echo ""
              fi
            fi
            echo "## Commits"
            echo ""
            echo "$COMMITS"
            echo ""
          } > "$CONTEXT_FILE"

          SOURCE="$BASE..HEAD"
        fi

        # Drop lock/generated/binary files; send the full diff or a summary
        bash "$ACTION_PATH/scripts/prepare-content.sh" < "$RAW_DIFF" > "$DIFF_SECTION"

        if [ ! -s "$DIFF_SECTION" ]; then
          echo "::warning::No relevant changes in $SOURCE after excluding lock, generated and binary files. Skipping suggestion."
          echo "empty=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "empty=false" >> "$GITHUB_OUTPUT"

        CONTENT_FILE=$(mktemp)
        {
          echo "# Changes"
          echo ""
          cat "$CONTEXT_FILE"
          cat "$DIFF_SECTION"
        } > "$CONTENT_FILE"

        echo "diff_file=$CONTENT_FILE" >> "$GITHUB_OUTPUT"

        LINES=$(wc -l < "$CONTENT_FILE" | tr -d ' ')
        echo "Content generated from $SOURCE: $LINES lines"

    - name: Submit suggestions
      id: suggest
      if: steps.diff.outputs.empty != 'true'
      shell: bash
      run: |
        set -euo pipefail

        DIFF_FILE="${{ steps.diff.outputs.diff_file }}"
        API_URL="${{ inputs.api_url }}"
        COLLECTION_ID="${{ inputs.collection_id }}"

        # Build the JSON payload
        CONTENT=$(jq -Rs '.' < "$DIFF_FILE")

        if [ -n "$COLLECTION_ID" ]; then
          PAYLOAD=$(jq -n \
            --argjson content "$CONTENT" \
            --arg collection_id "$COLLECTION_ID" \
            '{ content: $content, collection_id: $collection_id }')
        else
          PAYLOAD=$(jq -n \
            --argjson content "$CONTENT" \
            '{ content: $content }')
        fi

        # Call the Brainfish API
        HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST "${API_URL}/v1/documents/suggestion" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ inputs.api_key }}" \
          -d "$PAYLOAD")

        HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
        HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

        # Clean up temp file
        rm -f "$DIFF_FILE"

        echo "API response status: $HTTP_STATUS"

        if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
          TASK_ID=$(echo "$HTTP_BODY" | jq -r '.data.task_id // empty')
          STATUS=$(echo "$HTTP_BODY" | jq -r '.data.status // empty')
          MESSAGE=$(echo "$HTTP_BODY" | jq -r '.message // empty')

          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Suggestion pipeline triggered successfully: $MESSAGE"
        else
          ERROR=$(echo "$HTTP_BODY" | jq -r '.message // .error // "Unknown error"' 2>/dev/null || echo "$HTTP_BODY")
          echo "::error::API request failed ($HTTP_STATUS): $ERROR"
          exit 1
        fi
